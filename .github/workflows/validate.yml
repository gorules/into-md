name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Pinned nightly for the size-optimized wasm build
        run: |
          TOOLCHAIN=$(node -p "require('fs').readFileSync('scripts/build.mjs', 'utf8').match(/TOOLCHAIN = '([^']+)'/)[1]")
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rust-src --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: cargo test --release --features full

      - name: Build wasm
        run: pnpm build

      - name: Third-party notices are up to date
        run: |
          pnpm notices
          git diff --exit-code THIRD_PARTY_LICENSES.md

      - name: JavaScript tests
        run: pnpm test:js

      - name: Type declarations
        run: pnpm typecheck

      - name: Package exports and types resolve for consumers
        run: pnpm attw

      - name: Pack
        run: pnpm pack

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: gorules-into-md-*.tgz
