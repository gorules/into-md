[package]
name = "into-md"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gorules/into-md"
publish = false

[lib]
name = "into_md"
crate-type = ["cdylib"]

[dependencies]
into-md-pdf = { path = "../pdf", optional = true }
quick-xml = "0.41"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[features]
default = ["pdf"]
pdf = ["dep:into-md-pdf", "dep:getrandom"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, optional = true }
